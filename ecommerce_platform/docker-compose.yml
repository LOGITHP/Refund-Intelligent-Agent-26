services:
  postgres:
    image: postgres:16-alpine
    container_name: sk_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shipkart}
      POSTGRES_USER: ${POSTGRES_USER:-shipkart}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shipkart_dev_pass}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shipkart} -d ${POSTGRES_DB:-shipkart}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: sk_minio
    user: "0:0"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sk_backend
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-shipkart}:${POSTGRES_PASSWORD:-shipkart_dev_pass}@postgres:5432/${POSTGRES_DB:-shipkart}
      SECRET_KEY: ${SECRET_KEY:-shipkart-dev-secret-key-change-in-production}
      MINIO_ENDPOINT: minio:9000
      MINIO_PUBLIC_URL: http://localhost:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_SECURE: "false"
      SEED_SAMPLE_CATALOG: ${SEED_SAMPLE_CATALOG:-true}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
      PAYPAL_WEBHOOK_ID: ${PAYPAL_WEBHOOK_ID:-}
      PAYPAL_ENV: ${PAYPAL_ENV:-SANDBOX}
      APP_DATA_ENCRYPTION_KEY: ${APP_DATA_ENCRYPTION_KEY:-}
      RESERVATION_TTL_MINUTES: ${RESERVATION_TTL_MINUTES:-15}
      AGENT_PLATFORM_URL: ${AGENT_PLATFORM_DOCKER_URL:-http://host.docker.internal:8100}
      BRIDGE_SHARED_SECRET: ${BRIDGE_SHARED_SECRET:-}
      SERVICE_JWT_SECRET: ${SERVICE_JWT_SECRET:-}
      SERVICE_JWT_ISSUER: ${SERVICE_JWT_ISSUER:-refund-intelligence-platform}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:3001,http://localhost:3002,http://127.0.0.1:3000,http://127.0.0.1:3001,http://127.0.0.1:3002}
    volumes:
      - backend_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

  customer_frontend:
    build:
      context: ./customer_frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
        VITE_AGENT_API_URL: ${VITE_AGENT_API_URL:-http://localhost:8100}
    container_name: sk_customer_ui
    ports:
      - "3000:3000"
    depends_on:
      - backend

  merchant_frontend:
    build:
      context: ./merchant_frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
        VITE_AGENT_API_URL: ${VITE_AGENT_API_URL:-http://localhost:8100}
        VITE_OPS_CONSOLE_URL: ${VITE_OPS_CONSOLE_URL:-http://localhost:3002}
    container_name: sk_merchant_ui
    ports:
      - "3001:3001"
    depends_on:
      - backend

volumes:
  postgres_data:
  minio_data:
  backend_data:
